name: Publish gdcore-tools for new GDevelop version

on:
  workflow_dispatch:
    inputs:
      gdevelop_tag:
        description: "GDevelop tag to build (for example: v5.6.274)"
        required: true
        type: string
      prerelease:
        description: "Publish as prerelease only"
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [gdevelop-release]

concurrency:
  cancel-in-progress: true
  group: release

jobs:
  generate-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve release metadata
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG_NAME=${{ inputs.gdevelop_tag }}" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=${{ inputs.prerelease }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG_NAME=${{ github.event.client_payload.release.tag_name }}" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=${{ github.event.client_payload.release.prerelease }}" >> "$GITHUB_ENV"
          fi
      - name: Download Emscripten
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          path: emsdk
      - name: Download GDevelop
        uses: actions/checkout@v4
        with:
          repository: 4ian/GDevelop
          path: GDevelop
          ref: refs/tags/${{ env.RELEASE_TAG_NAME }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: gdcore-tools

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install other dependencies
        run: |
          sudo snap install yq
          ./emsdk/emsdk install 3.1.21
          ./emsdk/emsdk activate 3.1.21

      - name: Bump package version
        run: |
          npm ci
          new_version="$(node -e "console.log($(yq '.version' package.json).split('-')[0])")-gd-${{ env.RELEASE_TAG_NAME }}-autobuild"
          yq ".version = \"$new_version\"" -iP package.json
        working-directory: gdcore-tools

      - name: Build & publish
        run: |
          source ../emsdk/emsdk_env.sh
          npm publish --provenance --access public --tag prerelease
          PACKAGE="gdcore-tools@$(jq -r '.version' package.json)"
          if ! ${{ env.RELEASE_PRERELEASE }}; then
            echo "Marking as latest"
            npm dist-tag add $PACKAGE latest
          fi
          npm dist-tag add $PACKAGE gd-release-'${{ env.RELEASE_TAG_NAME }}'
        working-directory: gdcore-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          content: "Failed to build gdcore-tools!!!"
